<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شاطر - العروض والنشاطات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background: #f5f5f5; }
        .promo-card { border: none; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; background: white; }
        .promo-card:hover { transform: translateY(-2px); }
        .promo-img { width: 100%; height: 200px; object-fit: contain; background: #f5f5f5; }
        .type-badge { position: absolute; top: 10px; right: 10px; }
        .video-btn { background: #FF0000; color: white; border: none; border-radius: 8px; padding: 4px 12px; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .video-btn:hover { background: #CC0000; color: white; }
        .header-section { background: linear-gradient(135deg, #0B1849, #1a2a6c); color: white; padding: 20px; text-align: center; }
        .header-logo { width: 60px; height: 60px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
        .header-logo img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state i { font-size: 60px; margin-bottom: 15px; }
        .video-modal iframe { border: none; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="header-logo">
            <img src="img/logo.png" alt="شاطر">
        </div>
        <h5 class="fw-bold mb-1">شاطر</h5>
        <small>العروض والنشاطات</small>
    </div>

    <div class="container py-3">
        <div id="promotionsContainer" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2 text-muted">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <!-- Video embed modal -->
    <div class="modal fade video-modal" id="videoModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 bg-dark shadow-none">
                <div class="modal-body p-2 text-center position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 z-1" data-bs-dismiss="modal" aria-label="إغلاق"></button>
                    <div id="videoPlayerContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        function getYouTubeId(url) {
            if (!url) return null;
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            for (const p of patterns) {
                const m = url.match(p);
                if (m) return m[1];
            }
            return null;
        }
        function getTikTokId(url) {
            if (!url) return null;
            const patterns = [
                /tiktok\.com\/[^\/]+\/video\/(\d+)/,
                /tiktok\.com\/video\/(\d+)/,
                /tiktok\.com\/t\/([\w-]+)/
            ];
            for (const p of patterns) {
                const m = url.match(p);
                if (m) return m[1];
            }
            return null;
        }
        var videoGen = 0;
        function playVideo(videoUrl) {
            const container = document.getElementById('videoPlayerContainer');
            const modal = new bootstrap.Modal(document.getElementById('videoModal'));
            document.getElementById('videoModal').addEventListener('hidden.bs.modal', function () { container.innerHTML = ''; }, { once: true });
            const gen = ++videoGen;

            function activateBlocker() {
                if (gen !== videoGen) return;
                const iframe = container.querySelector('iframe');
                if (!iframe || container.querySelector('.video-click-blocker')) return;
                const blocker = document.createElement('div');
                blocker.className = 'video-click-blocker';
                blocker.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;cursor:default;z-index:0;';
                iframe.parentNode.insertBefore(blocker, iframe.nextSibling);
            }

            function buildEmbed(iframeHtml, centered) {
                container.innerHTML = `<div style="position:relative;width:100%;${centered ? 'display:flex;justify-content:center;' : ''}">${iframeHtml}</div>`;
                const iframe = container.querySelector('iframe');
                let firstLoad = true;
                iframe.addEventListener('load', function () {
                    if (firstLoad) { firstLoad = false; return; }
                    activateBlocker();
                });
                setTimeout(activateBlocker, 6000);
            }

            const ytId = getYouTubeId(videoUrl);
            if (ytId) {
                buildEmbed(`<iframe src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&controls=1&fs=0" style="width:100%;max-height:70vh;aspect-ratio:16/9;" allow="autoplay; encrypted-media" allowfullscreen></iframe>`, false);
                modal.show();
                return;
            }
            const ttId = getTikTokId(videoUrl);
            if (ttId) {
                buildEmbed(`<iframe src="https://www.tiktok.com/embed/v2/${ttId}" style="height:70vh;max-width:100%;aspect-ratio:9/16;" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`, true);
                modal.show();
                return;
            }
            window.open(videoUrl, '_blank');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDsO_-6QFQKgIMF7VROzZYK22kyKyjQ_ZM",
            authDomain: "shater-cars.firebaseapp.com",
            projectId: "shater-cars",
            storageBucket: "shater-cars.firebasestorage.app",
            messagingSenderId: "891304990952",
            appId: "1:891304990952:web:6b356e9da561b57fc7915d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const typeLabels = { promotion: 'عرض', activity: 'نشاط', offer: 'تخفيض' };
        const typeColors = { promotion: '#0B1849', activity: '#2E7D32', offer: '#B71C1C' };

        function loadPromotions() {
            const container = document.getElementById('promotionsContainer');
            db.collection('promotions').where('active', '==', true)
                .get()
                .then(snapshot => {
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="col-12"><div class="empty-state"><i class="bi bi-megaphone text-muted"></i><p>لا توجد عروض حالياً</p></div></div>';
                        return;
                    }
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    docs.sort((a, b) => {
                        const tA = a.createdAt?.toMillis?.() ?? 0;
                        const tB = b.createdAt?.toMillis?.() ?? 0;
                        return tB - tA;
                    });
                    container.innerHTML = docs.map(doc => {
                        const p = doc;
                        const imgs = (p.images || []).filter(function(u) { return u && (u.startsWith('http') || u.startsWith('data:image')); });
                        const imgHtml = imgs.length > 0
                            ? `<div id="carousel-${doc.id}" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-inner">${imgs.map((u, i) => `<div class="carousel-item${i === 0 ? ' active' : ''}"><img src="${u}" class="promo-img" alt="" onerror="this.style.display='none'"></div>`).join('')}</div>
                                ${imgs.length > 1 ? `<button class="carousel-control-prev" type="button" data-bs-target="#carousel-${doc.id}" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" type="button" data-bs-target="#carousel-${doc.id}" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>` : ''}
                              </div>`
                            : `<div style="height:200px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;"><i class="bi bi-megaphone" style="font-size:40px;color:#bbb;"></i></div>`;
                        const videoHtml = p.videoUrl ? `<button class="video-btn" onclick="playVideo('${p.videoUrl.replace(/'/g, "\\'")}')"><i class="bi bi-play-fill"></i> فيديو</button>` : '';
                        const descHtml = p.description ? `<p class="text-muted small mb-1" style="font-size:14px;">${p.description}</p>` : '';
                        return `<div class="col-md-4 col-sm-6">
                            <div class="promo-card position-relative">
                                <span class="type-badge badge" style="background:${typeColors[p.type] || '#6c757d'};color:white;">${typeLabels[p.type] || p.type}</span>
                                ${imgHtml}
                                <div class="p-3">
                                    <h6 class="fw-bold mb-1">${p.title}</h6>
                                    ${descHtml}
                                    ${videoHtml ? `<div class="mt-2">${videoHtml}</div>` : ''}
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(err => {
                    container.innerHTML = `<div class="col-12 text-center text-danger py-5">حدث خطأ: ${err.message}</div>`;
                });
        }

        loadPromotions();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
