<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاطر - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --k-blue: #0B1849;
            --k-blue-light: #1A2D6D;
            --k-gold: #D4A843;
            --k-gold-light: #E8C76A;
            --k-purple: #6A1B9A;
            --k-purple-light: #9C27B0;
            --k-red: #C62828;
            --k-white: #FFFFFF;
            --k-black: #121212;
            --k-bg: #F0F0F5;
        }

        * { font-family: 'Cairo', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--k-blue);
            margin: 0;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: var(--k-white);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-header {
            background: var(--k-blue);
            padding: 40px 32px 32px;
            text-align: center;
            position: relative;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--k-white);
            border-radius: 50% 50% 0 0;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            border: 4px solid var(--k-gold);
            object-fit: cover;
            margin-bottom: 12px;
        }

        .login-header h1 {
            color: var(--k-white);
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }

        .login-header p {
            color: var(--k-gold-light);
            font-size: 14px;
            margin: 4px 0 0;
        }

        .login-body {
            padding: 36px 32px 32px;
        }

        .login-body .form-label {
            font-weight: 700;
            font-size: 13px;
            color: #555;
        }

        .login-body .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #E0E0E0;
            transition: border-color 0.2s;
        }

        .login-body .form-control:focus {
            border-color: var(--k-gold);
            box-shadow: 0 0 0 3px rgba(212,168,67,0.2);
        }

        .login-body .form-control-lg {
            padding: 14px 16px;
        }

        .btn-login {
            background: var(--k-blue);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s;
            color: var(--k-white);
        }

        .btn-login:hover {
            background: var(--k-blue-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(11,24,73,0.4);
            color: var(--k-gold-light);
        }

        .login-error {
            color: var(--k-red);
            font-size: 13px;
            font-weight: 600;
            min-height: 24px;
            margin-top: 8px;
            text-align: center;
        }

        .login-footer {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-top: 24px;
        }

        .input-group-text {
            border-radius: 0 12px 12px 0;
            border: 2px solid #E0E0E0;
            border-right: none;
            background: var(--k-bg);
            color: var(--k-blue);
        }

        .input-group .form-control {
            border-radius: 12px 0 0 12px;
            border-left: none;
        }

        .input-group .form-control:focus ~ .input-group-text,
        .input-group .form-control:focus + .input-group-text {
            border-color: var(--k-gold);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="img/logo.png" alt="شاطر" class="login-logo">
                <h1>شاطر</h1>
                <p>لوحة تحكم الإدارة</p>
            </div>
            <div class="login-body">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم</label>
                    <div class="input-group">
                        <input type="text" class="form-control form-control-lg" id="loginUser" placeholder="أدخل اسم المستخدم" autocomplete="username">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="loginPass" placeholder="أدخل كلمة المرور" autocomplete="current-password">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    </div>
                </div>
                <div class="login-error" id="loginError"></div>
                <button class="btn btn-login mt-2" id="loginBtn">
                    <i class="bi bi-box-arrow-in-left me-2"></i>تسجيل الدخول
                </button>
            </div>
        </div>
        <p class="login-footer">شاطر © 2026 — نظام إدارة رحلات النقل </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.2.1/compressor.min.js"></script>
    <!-- CUSTOM MODAL -->
    <div class="ara-modal-overlay" id="araModalOverlay">
        <div class="ara-modal" id="araModal">
            <div class="ara-modal-icon" id="araModalIcon"><i class="bi bi-question-circle"></i></div>
            <h5 id="araModalTitle">تأكيد</h5>
            <p id="araModalMessage">هل أنت متأكد؟</p>
            <div class="btn-group" id="araModalButtons">
                <button class="btn btn-cancel" id="araModalCancel">إلغاء</button>
                <button class="btn btn-ok" id="araModalConfirm">تأكيد</button>
            </div>
        </div>
    </div>
    <style>
        .ara-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            z-index: 99999; display: none;
            align-items: center; justify-content: center;
            animation: araFadeIn 0.2s ease;
        }
        .ara-modal-overlay.show { display: flex; }
        .ara-modal {
            background: white; border-radius: 16px; padding: 32px 28px 24px;
            max-width: 420px; width: 90%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: araScaleIn 0.25s ease;
            direction: rtl;
        }
        .ara-modal-icon {
            width: 64px; height: 64px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; font-size: 28px;
        }
        .ara-modal-icon.info { background: #e8f0fe; color: #0B1849; }
        .ara-modal-icon.warning { background: #fff3cd; color: #856404; }
        .ara-modal-icon.error { background: #fde8e8; color: #dc3545; }
        .ara-modal-icon.success { background: #d4edda; color: #155724; }
        .ara-modal-icon.question { background: #e8f0fe; color: #0B1849; }
        .ara-modal h5 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #1a1a2e; }
        .ara-modal p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.6; }
        .ara-modal .btn-group { display: flex; gap: 10px; }
        .ara-modal .btn-group .btn { flex: 1; border-radius: 10px; font-weight: 600; padding: 10px; font-size: 14px; }
        .ara-modal .btn-ok { background: #0B1849; color: white; border: none; }
        .ara-modal .btn-ok:hover { background: #1a2a6e; }
        .ara-modal .btn-cancel { background: #f0f0f0; color: #666; border: none; }
        .ara-modal .btn-cancel:hover { background: #e0e0e0; }
        .ara-modal .btn-danger { background: #dc3545; color: white; border: none; }
        .ara-modal .btn-danger:hover { background: #c82333; }
        @keyframes araFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes araScaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
    <script src="js/login.js?v=20260818"></script>
</body>
</html>
